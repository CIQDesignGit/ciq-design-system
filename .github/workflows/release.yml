# On push to develop/release/main: bump version, commit + tag, build, publish public npm package.
name: Release and Publish

on:
  push:
    branches: [develop, release, main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release-publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version by branch
        id: bump
        working-directory: packages/ui
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "develop" ]; then
            npm version prerelease --preid=develop --no-git-tag-version
          elif [ "$BRANCH" = "release" ]; then
            npm version patch --no-git-tag-version
          else
            npm version major --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ui/package.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"

      - name: Push branch and tag
        run: |
          git push origin ${{ github.ref_name }}
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Build
        run: pnpm build

      - name: Publish to npm
        working-directory: packages/ui
        run: npm publish --provenance --access public
